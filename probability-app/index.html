<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Continuous Probability Distributions: Industry Applications</title><style>
*{box-sizing:border-box}body{margin:0;background:#f1f5f9;color:#172b42;font:16px system-ui,sans-serif}header{background:#132b45;color:white;padding:32px max(5%,calc((100% - 1100px)/2))}header h1{font-size:clamp(25px,4vw,40px);margin:8px 0}header p{color:#bcd1e8}nav{background:white;display:flex;gap:8px;flex-wrap:wrap;padding:12px 5%;border-bottom:1px solid #d5dfeb}button{cursor:pointer;border:0;border-radius:8px;padding:12px 16px;background:#245bb5;color:white;font:600 14px system-ui}nav button{background:#e9eff7;color:#24466c}nav button.active{background:#245bb5;color:white}main{max-width:1100px;margin:auto;padding:24px 16px}section,.panel{background:white;border:1px solid #dbe4ee;border-radius:14px;padding:22px;margin-bottom:18px}h2,h3{margin-top:0}p{line-height:1.65;color:#475569}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px}.field{display:flex;flex-direction:column;gap:7px}input,select{font:inherit;padding:11px;border:1px solid #aabbd0;border-radius:7px;width:100%;background:white;color:#172b42}label{font-weight:600;font-size:14px}.metric{background:#f0f5fc;padding:16px;border-radius:10px}.metric strong{display:block;font-size:25px;margin:8px 0;color:#174d9e;overflow-wrap:anywhere}.metric small{color:#475569}.formula{background:#edf3fa;padding:12px;border-radius:7px;font-family:Georgia,serif;font-size:18px;overflow-wrap:anywhere}.error{color:#a31525;background:#fff0f0;padding:12px;border-radius:8px}svg{width:100%;height:auto;display:block}.legend{display:flex;flex-wrap:wrap;gap:16px;font-size:13px}.dot{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:5px}footer{text-align:center;padding:24px;color:#64748b}button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #e9a52d} .hero{background:#e5efff}.eyebrow{font-size:12px;letter-spacing:1.5px;font-weight:700;color:#245bb5}header .eyebrow{color:#a9c9ef} [hidden]{display:none!important} @media(max-width:480px){section,.panel{padding:15px}nav button{flex:1}main{padding:14px}}
</style><header><div class="eyebrow">AIML · APPLIED PROBABILITY LAB</div><h1>Continuous Probability Distributions: Industry Applications</h1><p>Explore mathematics through real-world industry problems.</p></header><nav id="nav" aria-label="Main navigation"></nav><main id="main"></main><footer>Undergraduate AIML · Interactive educational application · Illustrative models</footer><script>
'use strict';const $=id=>document.getElementById(id);const names=['Home','Normal Distribution','Exponential Distribution','Central Limit Theorem'];const subtitles=['','Manufacturing Quality Control','Cloud Request Inter-arrival Time','Warehouse Processing Time'];const defaults=[[],[10,.05,9.9,10.1,10],[12,10,5,15],[30,6,36,32]];const labels=[[],['Mean diameter μ (mm)','Standard deviation σ (mm)','Lower specification limit (mm)','Upper specification limit (mm)','Selected diameter x (mm)'],['Arrival rate λ (requests/minute)','Time threshold t (seconds)','Elapsed time t₁ (seconds)','Total waiting time t₂ (seconds)'],['Population mean μ (minutes)','Population standard deviation σ (minutes)','Sample size n (orders)','Target sample mean x (minutes)']];const problems=['','A factory manufactures shafts with a target diameter of 10 mm. Shafts outside the specification limits are defective. Assume diameters are normally distributed.','A cloud server receives requests according to a constant-rate Poisson arrival process. Inter-arrival time is the gap between incoming requests, not server response or processing time.','A warehouse processes orders with variable completion times. Estimate the probability that the average processing time of a random sample exceeds a target. Assume independent, identically distributed processing times with finite variance. The normal approximation improves as sample size grows, depending on population shape.'];let page=0,values=defaults.map(a=>a.map(String)),mode='both';const fmt=(x,d=6)=>x===0?'0':Math.abs(x)<10**(-d)||Math.abs(x)>=1e7?x.toExponential(4):Number(x.toFixed(d)).toString();const pct=x=>fmt(100*x,4)+'%';const phi=z=>Math.exp(-z*z/2)/Math.sqrt(2*Math.PI);function tail(z){if(z===0)return .5;if(z<0)return 1-tail(-z);if(z===Infinity)return 0;let t=1/(1+.2316419*z);return Math.max(0,Math.min(.5,phi(z)*t*(.319381530+t*(-.356563782+t*(1.781477937+t*(-1.821255978+t*1.330274429))))))}const cdf=z=>tail(-z);const interval=(a,b)=>Math.max(0,a>=0?tail(a)-tail(b):b<=0?cdf(b)-cdf(a):1-cdf(a)-tail(b));const metric=(label,value,note='')=>`<div class="metric"><small>${label}</small><strong>${value}</strong><small>${note}</small></div>`;const formula=(s)=>`<div class="formula">${s}</div>`;const prob=p=>fmt(p)+' = '+pct(p);function go(i){page=i;mode='both';render();}function render(){ $('nav').innerHTML=names.map((n,i)=>`<button data-page="${i}" class="${i===page?'active':''}" ${i===page?'aria-current="page"':''}>${n}</button>`).join('');if(!page){$('main').innerHTML=`<section class="hero"><div class="eyebrow">LEARN · EXPLORE · APPLY</div><h2>Probability in the real world</h2><p>Change parameters, observe probability curves and discover how mathematics supports industry decisions.</p><button data-page="1">Start learning</button></section><div class="grid">${names.slice(1).map((n,j)=>`<section><div class="eyebrow">MODULE 0${j+1}</div><h2>${n}</h2><h3>${subtitles[j+1]}</h3><p>${problems[j+1]}</p><button data-page="${j+1}">Explore module →</button></section>`).join('')}</div>`;return;} $('main').innerHTML=`<section><div class="eyebrow">MODULE 0${page}</div><h2>${names[page]} — ${subtitles[page]}</h2><h3>Industry problem</h3><p>${problems[page]}</p></section><section><h3>Input parameters</h3><div class="grid">${labels[page].map((l,i)=>`<div class="field"><label for="v${i}">${l}</label><input id="v${i}" data-field="${i}" type="number" step="${page===3&&i===2?'1':'any'}" value="${values[page][i]}"></div>`).join('')}</div><p>Results update automatically when inputs change.</p><button id="reset">Reset defaults</button><p id="error" class="error" role="alert" hidden></p></section><div id="results"><section><h3>Live calculation results</h3><div id="metrics" class="grid"></div></section><section><h3>Dynamic visualization</h3>${page===2?'<label for="mode">Probability region</label><select id="mode"><option value="both">Both regions</option><option value="within">Arrival within threshold</option><option value="beyond">Wait longer than threshold</option><option value="conditional">Memoryless: remaining wait</option></select>':''}<div id="graph"></div><div id="legend" class="legend"></div><p id="graphnote"></p></section><section><h3>Mathematical formulas and numerical answers</h3><div id="math"></div></section><section><h3>Interpretation of results</h3><div id="interpret"></div></section></div><button data-page="${page-1}">← Previous</button> <button data-page="${page===3?0:page+1}">${page===3?'Home':'Next module'} →</button>`;update();}
function graph({a,b,fn,scale,convert,regions,marks,xlabel,yunit}){const L=78,R=720,B=250,H=210,X=z=>L+(z-a)/(b-a)*(R-L),Y=z=>B-fn(z)*H;const path=(l,u)=>Array.from({length:201},(_,i)=>{let z=l+(u-l)*i/200;return `${i?'L':'M'}${X(z).toFixed(2)} ${Y(z).toFixed(2)}`}).join(' ');let s='';for(let i=0;i<=4;i++){let y=B-H*i/4;s+=`<path d="M${L} ${y}H${R}" stroke="#e2e8f0"/><text x="${L-8}" y="${y+4}" text-anchor="end" font-size="11">${fmt(scale*i/4,3)}</text>`}for(let i=0;i<=6;i++){let z=a+(b-a)*i/6;s+=`<text x="${X(z)}" y="270" text-anchor="middle" font-size="11">${fmt(convert(z),4)}</text>`}for(const [lo,hi,color,opacity] of regions){let l=Math.max(a,lo),u=Math.min(b,hi);if(u>l)s+=`<path d="${path(l,u)} L${X(u)} ${B} L${X(l)} ${B} Z" fill="${color}" opacity="${opacity??.65}"/>`}s+=`<path d="${path(a,b)}" fill="none" stroke="#183b63" stroke-width="2.5"/><path d="M${L} 30V${B}H${R}" fill="none" stroke="#94a3b8"/>`;marks.forEach(([z,label],i)=>{if(z>=a&&z<=b)s+=`<path d="M${X(z)} ${15+i*13}V${B}" stroke="#245bb5" stroke-dasharray="5 4"/><text x="${X(z)}" y="${12+i*13}" text-anchor="middle" font-size="11" fill="#245bb5">${label}</text>`});$('graph').innerHTML=`<svg viewBox="0 0 750 315" role="img" aria-label="Probability density curve with shaded probability regions">${s}<text x="400" y="301" text-anchor="middle" font-size="13">${xlabel}</text><text transform="translate(15 145) rotate(-90)" text-anchor="middle" font-size="12">Density (${yunit})</text></svg>`;return marks.some(([z])=>z<a||z>b);}
const legend=items=>$('legend').innerHTML=items.map(([c,t])=>`<span><i class="dot" style="background:${c}"></i>${t}</span>`).join('');const green='#22a06b',red='#dc5353',orange='#e69a36',blue='#5284d6';function update(){if(!page)return;let v=values[page].map(s=>s.trim()===''?NaN:Number(s));let err='';if(!v.every(Number.isFinite))err='Enter finite numerical values in all fields.';else if(page===1&&(v[1]<=0||v[2]>=v[3]))err='Standard deviation must be positive and lower limit must be less than upper limit.';else if(page===2&&(v[0]<=0||v.slice(1).some(x=>x<0)||v[3]<v[2]))err='Rate must be positive, times non-negative, and t₂ ≥ t₁.';else if(page===3&&(v[0]<0||v[1]<=0||!Number.isSafeInteger(v[2])||v[2]<1||v[3]<0))err='Use non-negative times, positive standard deviation and a positive whole-number sample size.';if(!err&&v.some(x=>Math.abs(x)>1e12||(x!==0&&Math.abs(x)<1e-12)))err='Use practical values between 10⁻¹² and 10¹² in magnitude, or zero where allowed.';$('error').hidden=!err;$('error').textContent=err;$('results').hidden=!!err;if(err)return;let m='',f='',p='',note='';if(page===1){let [mu,s,l,u,x]=v,zl=(l-mu)/s,zu=(u-mu)/s,zx=(x-mu)/s,lo=cdf(zl),hi=tail(zu),ok=interval(zl,zu),bad=lo+hi,d=phi(zx)/s;m=metric('Probability density at x',fmt(d)+' mm⁻¹')+metric('Acceptable products',prob(ok))+metric('Undersized products',prob(lo))+metric('Oversized products',prob(hi))+metric('Expected defective percentage',pct(bad));f=formula('f(x) = exp[−(x−μ)²/(2σ²)] / (σ√(2π))')+`<p>f(${x}) = ${fmt(d)} mm⁻¹. Density is not the probability of an exact diameter.</p>`+formula('z = (x−μ)/σ; Φ(z) = standard normal CDF')+`<p>zL = ${fmt(zl)}, zU = ${fmt(zu)}, zx = ${fmt(zx)}</p>`+formula('P(L ≤ X ≤ U) = Φ(zU) − Φ(zL) = '+prob(ok))+formula('P(X &lt; L) = Φ(zL) = '+prob(lo))+formula('P(X &gt; U) = 1 − Φ(zU) = '+prob(hi))+formula('Defective % = 100 × [Φ(zL) + 1 − Φ(zU)] = '+pct(bad));p=`<p>About ${pct(ok)} of shafts meet specifications and ${pct(bad)} are defective. In 1,000 shafts, expect approximately ${Math.round(ok*1000)} acceptable and ${Math.round(bad*1000)} defective shafts. Keeping the process centered within specifications and reducing variation can improve quality.</p>`;let outside=graph({a:-5,b:5,fn:z=>Math.exp(-z*z/2),scale:phi(0)/s,convert:z=>mu+s*z,regions:[[-Infinity,zl,red],[zl,zu,green],[zu,Infinity,orange]],marks:[[zl,'LSL'],[zu,'USL'],[zx,'x'],[0,'μ']],xlabel:'Shaft diameter (mm)',yunit:'mm⁻¹'});legend([[red,'Undersized'],[green,'Acceptable'],[orange,'Oversized']]);note='Areas represent probabilities. Graph displays ±5 standard deviations.'+(outside?' Some markers are outside the visible range.':'');}else if(page===2){let [r,t,t1,t2]=v,l=r/60,mean=1/l,variance=mean**2,within=-Math.expm1(-l*t),beyond=Math.exp(-l*t),delta=t2-t1,cond=Math.exp(-l*delta);m=metric('Mean inter-arrival time',fmt(mean)+' s',fmt(mean/60)+' min')+metric('Variance',fmt(variance)+' s²',fmt(variance/3600)+' min²')+metric('P(T ≤ t)',prob(within))+metric('P(T > t)',prob(beyond))+metric('Conditional probability',prob(cond));f=formula('λ per second = λ per minute / 60 = '+fmt(l)+' s⁻¹')+`<p>${t} seconds = ${fmt(t/60)} minutes. All calculations use seconds.</p>`+formula('f(t) = λ exp(−λt), t ≥ 0')+formula('E(T) = 1/λ = '+fmt(mean)+' s')+formula('Var(T) = 1/λ² = '+fmt(variance)+' s²')+formula('P(T ≤ t) = 1 − exp(−λt) = '+prob(within))+formula('P(T &gt; t) = exp(−λt) = '+prob(beyond))+formula('P(T &gt; t₂ | T &gt; t₁) = exp[−λ(t₂−t₁)] = '+prob(cond));p=`<p>On average a request arrives every ${fmt(mean)} seconds. The chance of waiting longer than ${t} seconds is ${pct(beyond)}.</p><h3>Memoryless property</h3><p>If you have already waited ${t1} seconds without an arrival, the chance of waiting more than another ${delta} seconds is ${pct(cond)}. The past wait does not change the distribution of the remaining wait under the constant-rate Poisson model.</p><p>These probabilities describe incoming traffic, not server response time.</p>`;let conditional=mode==='conditional',cut=l*(conditional?delta:t),b=Math.max(5,Math.min(12,cut*1.2));let outside=graph({a:0,b,fn:z=>Math.exp(-z),scale:l,convert:z=>z/l,regions:[[0,cut,green,mode==='beyond'||conditional?.15:.7],[cut,Infinity,orange,mode==='within'?.15:.7]],marks:[[cut,conditional?'Δt':'t']],xlabel:(conditional?'Remaining wait':'Inter-arrival time')+' (seconds)',yunit:'s⁻¹'});legend([[green,'Within threshold'],[orange,'Beyond threshold']]);note=(conditional?'Conditional remaining-wait tail = '+pct(cond):'Within threshold = '+pct(within)+'; beyond threshold = '+pct(beyond))+(outside?'. Threshold is beyond displayed range.':'. Curve continues beyond the displayed range.');}else{let [mu,s,n,x]=v,se=s/Math.sqrt(n),z=(x-mu)/se,lo=cdf(z),hi=tail(z);m=metric('Mean of sample means',fmt(mu)+' min')+metric('Standard error',fmt(se)+' min')+metric('Variance of sample mean',fmt(se*se)+' min²')+metric('P(sample mean ≤ target)',prob(lo))+metric('P(sample mean > target)',prob(hi));f=formula('E(X̄) = μ = '+fmt(mu)+' min')+formula('Var(X̄) = σ²/n = '+fmt(se*se)+' min²')+formula('SE = σ/√n = '+fmt(se)+' min')+formula('z = (x−μ)/SE = '+fmt(z))+formula('P(X̄ ≤ x) ≈ Φ(z) = '+prob(lo))+formula('P(X̄ &gt; x) ≈ 1−Φ(z) = '+prob(hi));p=`<p>For samples of ${n} orders, the average processing time is centered at ${mu} minutes with standard error ${fmt(se)} minutes. The estimated chance that the sample average exceeds ${x} minutes is ${pct(hi)}. Increasing sample size reduces standard error, not the variability of individual orders.</p><p>${n<30?'Caution: for small samples, the normal approximation may be poor unless the population is normal.':'The approximation depends on population shape; n ≥ 30 is a heuristic, not a guarantee.'}</p>`;let outside=graph({a:-5,b:5,fn:z=>Math.exp(-z*z/2),scale:phi(0)/se,convert:z=>mu+se*z,regions:[[-Infinity,z,blue],[z,Infinity,orange]],marks:[[0,'μ'],[z,'Target']],xlabel:'Sample mean processing time (minutes)',yunit:'min⁻¹'});legend([[blue,'At or below target'],[orange,'Above target']]);note='Normal approximation to the sampling distribution of the mean.'+(outside?' Target lies outside the displayed range.':'');}$('metrics').innerHTML=m;$('math').innerHTML=f;$('interpret').innerHTML=p;$('graphnote').textContent=note;}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.page!==undefined)go(Number(b.dataset.page));if(b.id==='reset'){values[page]=defaults[page].map(String);mode='both';render()}});document.addEventListener('input',e=>{if(e.target.dataset.field!==undefined){values[page][Number(e.target.dataset.field)]=e.target.value;update()}});document.addEventListener('change',e=>{if(e.target.id==='mode'){mode=e.target.value;update()}});render();
</script></html>
