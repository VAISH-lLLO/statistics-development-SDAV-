<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Discrete Probability Distributions</title>
  <style>
    :root {
      --bg: #f7f8fa;
      --card: #ffffff;
      --text: #1f2937;
      --muted: #6b7280;
      --border: #e5e7eb;
      --accent: #2563eb;
      --accent-soft: #eff6ff;
      --error: #b91c1c;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Inter, system-ui, -apple-system, "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
    }

    header {
      background: var(--card);
      border-bottom: 1px solid var(--border);
    }

    .header-inner {
      max-width: 1000px;
      margin: 0 auto;
      padding: 18px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 24px;
    }

    .brand {
      font-size: 1.05rem;
      font-weight: 700;
      white-space: nowrap;
    }

    nav {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }

    nav button {
      border: 0;
      background: transparent;
      color: var(--muted);
      padding: 8px 12px;
      border-radius: 7px;
      cursor: pointer;
      font: inherit;
    }

    nav button:hover,
    nav button.active {
      background: var(--accent-soft);
      color: var(--accent);
    }

    main {
      max-width: 1000px;
      margin: 0 auto;
      padding: 48px 24px 64px;
    }

    .intro {
      margin-bottom: 28px;
    }

    h1 {
      margin: 0 0 8px;
      font-size: 2rem;
    }

    h2 {
      margin-top: 0;
      font-size: 1.35rem;
    }

    p {
      color: var(--muted);
      margin: 6px 0;
    }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 24px;
      margin-bottom: 20px;
    }

    .inputs {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 20px;
      margin-top: 20px;
    }

    .pmf-inputs {
      grid-template-columns: minmax(0, 360px);
    }

    label {
      display: block;
      font-size: 0.9rem;
      font-weight: 600;
      margin-bottom: 6px;
    }

    input {
      width: 100%;
      padding: 10px 11px;
      border: 1px solid #d1d5db;
      border-radius: 7px;
      font: inherit;
      background: white;
    }

    input:focus {
      outline: 2px solid #bfdbfe;
      border-color: var(--accent);
    }

    input.invalid {
      border-color: var(--error);
      outline: 2px solid #fecaca;
    }

    .error {
      min-height: 22px;
      margin-top: 6px;
      color: var(--error);
      font-size: 0.85rem;
    }

    .selected-values {
      margin-top: 24px;
      padding: 18px;
      border-radius: 8px;
      background: var(--accent-soft);
      border: 1px solid #dbeafe;
    }

    .selected-values h3 {
      margin: 0 0 10px;
      font-size: 1rem;
    }

    .values {
      display: flex;
      gap: 32px;
      flex-wrap: wrap;
    }

    .value strong {
      display: block;
      font-size: 1.3rem;
      color: var(--text);
    }

    .statistics {
      display: grid;
      grid-template-columns: repeat(5, minmax(0, 1fr));
      gap: 14px;
      margin-top: 20px;
    }

    .stat-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 18px;
    }

    .stat-card .label {
      color: var(--muted);
      font-size: 0.9rem;
      margin-bottom: 8px;
    }

    .stat-card .stat-value {
      font-size: 1.45rem;
      font-weight: 700;
    }

    .formula {
      margin: 16px 0 20px;
      padding: 16px;
      background: var(--accent-soft);
      border: 1px solid #dbeafe;
      border-radius: 8px;
      font-family: Georgia, "Times New Roman", serif;
      font-size: 1.1rem;
      overflow-x: auto;
    }

    .pmf-result {
      margin-top: 20px;
      padding: 18px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: #fafafa;
    }

    .result-label {
      color: var(--muted);
      font-size: 0.9rem;
      margin-bottom: 4px;
    }

    .result-value {
      font-size: 1.6rem;
      font-weight: 700;
    }

    .meaning {
      margin-top: 12px;
      color: var(--muted);
    }

    .cdf-results {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 14px;
      margin-top: 20px;
    }

    .cdf-card {
      background: #fafafa;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 18px;
    }

    .cdf-card .result-value {
      margin-top: 6px;
    }

    .pmf-chart-wrap {
      position: relative;
      width: 100%;
      height: 420px;
      margin-top: 18px;
    }

    #pmf-chart {
      display: block;
      width: 100%;
      height: 100%;
      cursor: crosshair;
    }

    .chart-tooltip {
      position: absolute;
      display: none;
      pointer-events: none;
      min-width: 150px;
      padding: 9px 11px;
      background: #1f2937;
      color: #ffffff;
      border-radius: 7px;
      font-size: 0.85rem;
      line-height: 1.45;
      box-shadow: 0 4px 14px rgba(0,0,0,0.14);
      z-index: 2;
    }

    .placeholder {
      text-align: center;
      padding: 70px 20px;
    }

    footer {
      max-width: 1000px;
      margin: 0 auto;
      padding: 0 24px 32px;
      color: var(--muted);
      font-size: 0.85rem;
    }

    @media (max-width: 850px) {
      .statistics {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
    }

    @media (max-width: 700px) {
      .header-inner {
        align-items: flex-start;
        flex-direction: column;
      }

      .inputs,
      .cdf-results {
        grid-template-columns: 1fr;
      }

      main {
        padding-top: 32px;
      }
    }
  </style>
</head>

<body>
  <header>
    <div class="header-inner">
      <div class="brand">Discrete Probability Distributions</div>
      <nav aria-label="Main navigation">
        <button data-page="home">Home</button>
        <button data-page="binomial">Binomial</button>
        <button data-page="poisson">Poisson</button>
        <button data-page="geometric">Geometric</button>
      </nav>
    </div>
  </header>

  <main id="app"></main>

  <footer>AIML Laboratory • Undergraduate Probability Module</footer>

  <script>
    const app = document.getElementById("app");
    const navButtons = document.querySelectorAll("nav button");

    function setActive(page) {
      function poissonPMF(lambda, k) {
      if (!Number.isFinite(lambda) || lambda <= 0 || !Number.isInteger(k) || k < 0) return NaN;
      let probability = Math.exp(-lambda);
      for (let i = 1; i <= k; i++) {
        probability *= lambda / i;
      }
      return probability;
    }

    function validatePoisson() {
      const lambdaInput = document.getElementById("lambda");
      if (!lambdaInput) return;

      const lambda = Number(lambdaInput.value);
      const valid = Number.isFinite(lambda) && lambda > 0;
      const error = document.getElementById("lambda-error");
      const selected = document.getElementById("selected-lambda");

      lambdaInput.classList.toggle("invalid", !valid);
      error.textContent = valid ? "" : "λ must be a positive number.";
      selected.textContent = valid ? lambda : "—";

      if (valid) {
        const mean = lambda;
        const variance = lambda;
        const standardDeviation = Math.sqrt(lambda);
        const secondMoment = lambda + lambda * lambda;
        const skewness = 1 / Math.sqrt(lambda);

        document.getElementById("poisson-mean").textContent = formatNumber(mean);
        document.getElementById("poisson-variance").textContent = formatNumber(variance);
        document.getElementById("poisson-std-dev").textContent = formatNumber(standardDeviation);
        document.getElementById("poisson-second-moment").textContent = formatNumber(secondMoment);
        document.getElementById("poisson-skewness").textContent = formatNumber(skewness);
      } else {
        ["poisson-mean", "poisson-variance", "poisson-std-dev", "poisson-second-moment", "poisson-skewness"]
          .forEach(id => document.getElementById(id).textContent = "—");
      }

      updatePoissonPMFAndCDF();
      drawPoissonPMFChart();
    }

    function updatePoissonPMFAndCDF() {
      const lambdaInput = document.getElementById("lambda");
      const kInput = document.getElementById("poisson-k");
      if (!lambdaInput || !kInput) return;

      const lambda = Number(lambdaInput.value);
      const k = Number(kInput.value);
      const lambdaValid = Number.isFinite(lambda) && lambda > 0;
      const kValid = Number.isInteger(k) && k >= 0;

      const kError = document.getElementById("poisson-k-error");
      const pmfOutput = document.getElementById("poisson-pmf-probability");
      const pmfMeaning = document.getElementById("poisson-pmf-meaning");
      const cdfOutput = document.getElementById("poisson-cdf-probability");
      const upperOutput = document.getElementById("poisson-upper-probability");

      kInput.classList.toggle("invalid", !kValid);

      if (!lambdaValid) {
        kError.textContent = "";
        pmfOutput.textContent = "—";
        cdfOutput.textContent = "—";
        upperOutput.textContent = "—";
        return;
      }

      kError.textContent = kValid ? "" : "k must be a non-negative integer.";
      if (!kValid) {
        pmfOutput.textContent = "—";
        cdfOutput.textContent = "—";
        upperOutput.textContent = "—";
        pmfMeaning.textContent = "P(X = k) means the probability of getting exactly k occurrences.";
        return;
      }

      const exactProbability = poissonPMF(lambda, k);
      let cumulativeProbability = 0;
      for (let x = 0; x <= k; x++) cumulativeProbability += poissonPMF(lambda, x);
      const upperProbability = Math.max(0, 1 - cumulativeProbability);

      pmfOutput.textContent = exactProbability.toFixed(6);
      cdfOutput.textContent = cumulativeProbability.toFixed(6);
      upperOutput.textContent = upperProbability.toFixed(6);
      pmfMeaning.textContent = `P(X = ${k}) means the probability of getting exactly ${k} occurrences.`;
    }

    let poissonChartBars = [];
    let poissonChartMetrics = null;

    function poissonChartMaxX(lambda) {
      // Include nearly all of the probability mass while keeping the chart readable.
      return Math.max(10, Math.ceil(lambda + 6 * Math.sqrt(lambda)));
    }

    function drawPoissonPMFChart() {
      const canvas = document.getElementById("poisson-pmf-chart");
      const lambdaInput = document.getElementById("lambda");
      if (!canvas || !lambdaInput) return;

      const lambda = Number(lambdaInput.value);
      const valid = Number.isFinite(lambda) && lambda > 0;
      const rect = canvas.getBoundingClientRect();
      const dpr = window.devicePixelRatio || 1;
      const width = Math.max(320, rect.width);
      const height = Math.max(320, rect.height);
      canvas.width = Math.round(width * dpr);
      canvas.height = Math.round(height * dpr);

      const ctx = canvas.getContext("2d");
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      ctx.clearRect(0, 0, width, height);
      poissonChartBars = [];
      poissonChartMetrics = null;
      hidePoissonChartTooltip();
      if (!valid) return;

      const maxX = poissonChartMaxX(lambda);
      const values = Array.from({ length: maxX + 1 }, (_, x) => poissonPMF(lambda, x));
      const maxProbability = Math.max(...values, 0.01);
      const margin = { top: 28, right: 24, bottom: 58, left: 62 };
      const plotWidth = width - margin.left - margin.right;
      const plotHeight = height - margin.top - margin.bottom;
      const baseline = margin.top + plotHeight;
      const yMax = maxProbability * 1.12;
      const slotWidth = plotWidth / (maxX + 1);
      const barWidth = Math.max(2, Math.min(42, slotWidth * 0.72));

      ctx.font = '12px system-ui, -apple-system, "Segoe UI", sans-serif';
      ctx.fillStyle = "#6b7280";
      ctx.strokeStyle = "#e5e7eb";
      ctx.lineWidth = 1;

      const tickCount = 5;
      for (let i = 0; i <= tickCount; i++) {
        const value = (yMax / tickCount) * i;
        const y = baseline - (value / yMax) * plotHeight;
        ctx.beginPath();
        ctx.moveTo(margin.left, y);
        ctx.lineTo(width - margin.right, y);
        ctx.stroke();
        ctx.textAlign = "right";
        ctx.textBaseline = "middle";
        ctx.fillText(value.toFixed(3), margin.left - 8, y);
      }

      ctx.strokeStyle = "#9ca3af";
      ctx.beginPath();
      ctx.moveTo(margin.left, margin.top);
      ctx.lineTo(margin.left, baseline);
      ctx.lineTo(width - margin.right, baseline);
      ctx.stroke();

      ctx.fillStyle = "#2563eb";
      values.forEach((probability, x) => {
        const centerX = margin.left + slotWidth * (x + 0.5);
        const barHeight = (probability / yMax) * plotHeight;
        const barX = centerX - barWidth / 2;
        const barY = baseline - barHeight;
        ctx.fillRect(barX, barY, barWidth, barHeight);
        poissonChartBars.push({ x, probability, left: barX, right: barX + barWidth, top: barY, bottom: baseline });
      });

      ctx.fillStyle = "#374151";
      ctx.textAlign = "center";
      ctx.textBaseline = "top";
      const labelStep = maxX <= 24 ? 1 : Math.ceil(maxX / 20);
      for (let x = 0; x <= maxX; x += labelStep) {
        const centerX = margin.left + slotWidth * (x + 0.5);
        ctx.fillText(String(x), centerX, baseline + 9);
      }
      if (maxX % labelStep !== 0) {
        const centerX = margin.left + slotWidth * (maxX + 0.5);
        ctx.fillText(String(maxX), centerX, baseline + 9);
      }

      ctx.font = '600 12px system-ui, -apple-system, "Segoe UI", sans-serif';
      ctx.fillText("Number of occurrences X", margin.left + plotWidth / 2, height - 16);

      ctx.save();
      ctx.translate(16, margin.top + plotHeight / 2);
      ctx.rotate(-Math.PI / 2);
      ctx.textAlign = "center";
      ctx.fillText("Probability P(X)", 0, 0);
      ctx.restore();

      const meanX = margin.left + slotWidth * (lambda + 0.5);
      ctx.save();
      ctx.setLineDash([6, 5]);
      ctx.strokeStyle = "#b91c1c";
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(meanX, margin.top);
      ctx.lineTo(meanX, baseline);
      ctx.stroke();
      ctx.restore();

      ctx.fillStyle = "#b91c1c";
      ctx.textAlign = meanX > width - 90 ? "right" : "left";
      ctx.textBaseline = "top";
      ctx.fillText(`Mean = ${lambda.toFixed(2)}`, meanX + (meanX > width - 90 ? -7 : 7), margin.top + 3);

      poissonChartMetrics = { left: margin.left, top: margin.top, plotWidth, plotHeight, baseline, slotWidth };
    }

    function handlePoissonChartMouseMove(event) {
      const canvas = document.getElementById("poisson-pmf-chart");
      const tooltip = document.getElementById("poisson-chart-tooltip");
      if (!canvas || !tooltip || !poissonChartMetrics) return;

      const rect = canvas.getBoundingClientRect();
      const x = event.clientX - rect.left;
      const y = event.clientY - rect.top;
      const bar = poissonChartBars.find(item => x >= item.left && x <= item.right && y >= item.top && y <= item.bottom);
      if (!bar) {
        hidePoissonChartTooltip();
        return;
      }

      tooltip.innerHTML = `X = ${bar.x}<br>P(X=${bar.x}) = ${bar.probability.toFixed(6)}`;
      tooltip.style.display = "block";
      const tooltipWidth = tooltip.offsetWidth;
      const tooltipHeight = tooltip.offsetHeight;
      const left = Math.min(Math.max(8, x + 12), rect.width - tooltipWidth - 8);
      const top = Math.min(Math.max(8, y - tooltipHeight - 10), rect.height - tooltipHeight - 8);
      tooltip.style.left = `${left}px`;
      tooltip.style.top = `${top}px`;
    }

    function hidePoissonChartTooltip() {
      const tooltip = document.getElementById("poisson-chart-tooltip");
      if (tooltip) tooltip.style.display = "none";
    }

    navButtons.forEach(btn => {
        btn.classList.toggle("active", btn.dataset.page === page);
      });
    }

    function render(page) {
      setActive(page);

      if (page === "home") {
        app.innerHTML = `
          <section class="intro">
            <h1>Discrete Probability Distributions</h1>
            <p>Interactive learning modules for the AIML laboratory.</p>
          </section>

          <section class="card">
            <h2>Laboratory Modules</h2>
            <p><strong>Binomial Distribution</strong> — available now.</p>
            <p><strong>Poisson Distribution</strong> — available now.</p>
            <p><strong>Geometric Distribution</strong> — available now.</p>
          </section>
        `;
        return;
      }

      if (page === "binomial") {
        app.innerHTML = `
          <section class="intro">
            <h1>Binomial Distribution</h1>
            <p>Specify the number of trials and the probability of success.</p>
          </section>

          <section class="card">
            <h2>Distribution Parameters</h2>

            <div class="inputs">
              <div>
                <label for="n">Number of trials (n)</label>
                <input id="n" type="number" min="1" step="1" value="20" aria-describedby="n-error">
                <div id="n-error" class="error"></div>
              </div>

              <div>
                <label for="p">Probability of success (p)</label>
                <input id="p" type="number" min="0" max="1" step="0.01" value="0.35" aria-describedby="p-error">
                <div id="p-error" class="error"></div>
              </div>
            </div>

            <div class="selected-values">
              <h3>Selected Values</h3>
              <div class="values">
                <div class="value">
                  <span>Number of trials (n)</span>
                  <strong id="selected-n">20</strong>
                </div>
                <div class="value">
                  <span>Probability of success (p)</span>
                  <strong id="selected-p">0.35</strong>
                </div>
              </div>
            </div>
          </section>

          <section class="card">
            <h2>Binomial Statistics</h2>
            <div class="statistics">
              <div class="stat-card">
                <div class="label">Mean</div>
                <div class="stat-value" id="mean">7.0000</div>
              </div>
              <div class="stat-card">
                <div class="label">Variance</div>
                <div class="stat-value" id="variance">4.5500</div>
              </div>
              <div class="stat-card">
                <div class="label">Standard Deviation</div>
                <div class="stat-value" id="std-dev">2.1331</div>
              </div>
              <div class="stat-card">
                <div class="label">Second Moment E[X²]</div>
                <div class="stat-value" id="second-moment">53.5500</div>
              </div>
              <div class="stat-card">
                <div class="label">Skewness</div>
                <div class="stat-value" id="skewness">0.1406</div>
              </div>
            </div>
          </section>

          <section class="card">
            <h2>Binomial PMF Calculator</h2>
            <p>For X ~ Binomial(n, p), calculate the probability of exactly k successes.</p>

            <div class="formula">
              P(X = k) = C(n,k) p<sup>k</sup> (1-p)<sup>(n-k)</sup>
            </div>

            <div class="inputs pmf-inputs">
              <div>
                <label for="k">Number of successes (k)</label>
                <input id="k" type="number" min="0" step="1" value="7" aria-describedby="k-error">
                <div id="k-error" class="error"></div>
              </div>
            </div>

            <div class="pmf-result">
              <div class="result-label">P(X = k)</div>
              <div class="result-value" id="pmf-probability">—</div>
              <p class="meaning" id="pmf-meaning">
                This is the probability of getting exactly k successes in n trials.
              </p>
            </div>
          </section>

          <section class="card">
            <h2>Binomial CDF Calculator</h2>
            <p>Using the same k value, calculate the cumulative probability.</p>

            <div class="formula">
              P(X &le; k) = &sum;<sub>x=0</sub><sup>k</sup> C(n,x) p<sup>x</sup> (1-p)<sup>(n-x)</sup>
            </div>

            <div class="cdf-results">
              <div class="cdf-card">
                <div class="result-label">P(X &le; k)</div>
                <div class="result-value" id="cdf-probability">—</div>
                <p class="meaning">P(X &le; k) means the probability of getting k or fewer successes.</p>
              </div>

              <div class="cdf-card">
                <div class="result-label">P(X &gt; k)</div>
                <div class="result-value" id="upper-probability">—</div>
                <p class="meaning">This is the probability of getting more than k successes.</p>
              </div>
            </div>
          </section>

          <section class="card">
            <h2>Binomial PMF Bar Chart</h2>
            <p>The chart shows P(X) for every possible number of successes from 0 to n.</p>
            <div class="pmf-chart-wrap">
              <canvas id="pmf-chart" aria-label="Binomial probability mass function bar chart"></canvas>
              <div id="chart-tooltip" class="chart-tooltip"></div>
            </div>
          </section>
        `;

        document.getElementById("n").addEventListener("input", validateBinomial);
        document.getElementById("p").addEventListener("input", validateBinomial);
        document.getElementById("k").addEventListener("input", updatePMFAndCDF);
        document.getElementById("pmf-chart").addEventListener("mousemove", handleChartMouseMove);
        document.getElementById("pmf-chart").addEventListener("mouseleave", hideChartTooltip);
        window.addEventListener("resize", drawPMFChart);

        validateBinomial();
        return;
      }

      if (page === "poisson") {
        app.innerHTML = `
          <section class="intro">
            <h1>Poisson Distribution</h1>
            <p>Specify the average rate of occurrence and explore the Poisson distribution.</p>
          </section>

          <section class="card">
            <h2>Distribution Parameters</h2>

            <div class="inputs pmf-inputs">
              <div>
                <label for="lambda">Average rate of occurrence (λ)</label>
                <input id="lambda" type="number" min="0.000001" step="0.01" value="4" aria-describedby="lambda-error">
                <div id="lambda-error" class="error"></div>
              </div>
            </div>

            <div class="selected-values">
              <h3>Selected Value</h3>
              <div class="values">
                <div class="value">
                  <span>Average rate of occurrence (λ)</span>
                  <strong id="selected-lambda">4</strong>
                </div>
              </div>
            </div>
          </section>

          <section class="card">
            <h2>Poisson Statistics</h2>
            <div class="statistics">
              <div class="stat-card">
                <div class="label">Mean</div>
                <div class="stat-value" id="poisson-mean">4.0000</div>
              </div>
              <div class="stat-card">
                <div class="label">Variance</div>
                <div class="stat-value" id="poisson-variance">4.0000</div>
              </div>
              <div class="stat-card">
                <div class="label">Standard Deviation</div>
                <div class="stat-value" id="poisson-std-dev">2.0000</div>
              </div>
              <div class="stat-card">
                <div class="label">Second Moment E[X²]</div>
                <div class="stat-value" id="poisson-second-moment">20.0000</div>
              </div>
              <div class="stat-card">
                <div class="label">Skewness</div>
                <div class="stat-value" id="poisson-skewness">0.5000</div>
              </div>
            </div>
          </section>

          <section class="card">
            <h2>Poisson PMF Calculator</h2>
            <p>For X ~ Poisson(λ), calculate the probability of exactly k occurrences.</p>

            <div class="formula">

    function formatNumber(value) {
      return Number.isFinite(value) ? value.toFixed(4) : "—";
    }

    function validateBinomial() {
      const nInput = document.getElementById("n");
      const pInput = document.getElementById("p");

      const nError = document.getElementById("n-error");
      const pError = document.getElementById("p-error");

      const selectedN = document.getElementById("selected-n");
      const selectedP = document.getElementById("selected-p");

      const n = Number(nInput.value);
      const p = Number(pInput.value);

      const nValid = Number.isInteger(n) && n > 0;
      const pValid = Number.isFinite(p) && p >= 0 && p <= 1;

      nInput.classList.toggle("invalid", !nValid);
      pInput.classList.toggle("invalid", !pValid);

      nError.textContent = nValid ? "" : "n must be a positive integer.";
      pError.textContent = pValid ? "" : "p must be between 0 and 1.";

      selectedN.textContent = nValid ? n : "—";
      selectedP.textContent = pValid ? p : "—";

      if (nValid && pValid) {
        calculateStatistics(n, p);
      } else {
        ["mean", "variance", "std-dev", "second-moment", "skewness"]
          .forEach(id => document.getElementById(id).textContent = "—");
      }

      updatePMFAndCDF();
      drawPMFChart();
    }

    function calculateStatistics(n, p) {
      const mean = n * p;
      const variance = n * p * (1 - p);
      const standardDeviation = Math.sqrt(variance);
      const secondMoment = variance + Math.pow(mean, 2);
      const skewness = standardDeviation === 0 ? NaN : (1 - 2 * p) / standardDeviation;

      document.getElementById("mean").textContent = formatNumber(mean);
      document.getElementById("variance").textContent = formatNumber(variance);
      document.getElementById("std-dev").textContent = formatNumber(standardDeviation);
      document.getElementById("second-moment").textContent = formatNumber(secondMoment);
      document.getElementById("skewness").textContent = formatNumber(skewness);
    }

    function combination(n, k) {
      if (k < 0 || k > n) return 0;

      k = Math.min(k, n - k);
      let result = 1;

      for (let i = 1; i <= k; i++) {
        result *= (n - k + i) / i;
      }

      return result;
    }

    function pmf(n, p, k) {
      return combination(n, k) * Math.pow(p, k) * Math.pow(1 - p, n - k);
    }

    function updatePMFAndCDF() {
      const nInput = document.getElementById("n");
      const pInput = document.getElementById("p");
      const kInput = document.getElementById("k");

      if (!nInput || !pInput || !kInput) return;

      const n = Number(nInput.value);
      const p = Number(pInput.value);
      const k = Number(kInput.value);

      const kError = document.getElementById("k-error");
      const pmfOutput = document.getElementById("pmf-probability");
      const pmfMeaning = document.getElementById("pmf-meaning");
      const cdfOutput = document.getElementById("cdf-probability");
      const upperOutput = document.getElementById("upper-probability");

      const nValid = Number.isInteger(n) && n > 0;
      const pValid = Number.isFinite(p) && p >= 0 && p <= 1;
      const kValid = Number.isInteger(k) && k >= 0 && k <= n;

      kInput.classList.toggle("invalid", !kValid);

      if (!nValid || !pValid) {
        kError.textContent = "";
        pmfOutput.textContent = "—";
        cdfOutput.textContent = "—";
        upperOutput.textContent = "—";
        pmfMeaning.textContent = "Enter valid values for n and p to calculate the probabilities.";
        return;
      }

      kError.textContent = kValid ? "" : "k must be an integer between 0 and n.";

      if (!kValid) {
        pmfOutput.textContent = "—";
        cdfOutput.textContent = "—";
        upperOutput.textContent = "—";
        pmfMeaning.textContent = "This is the probability of getting exactly k successes in n trials.";
        return;
      }

      const exactProbability = pmf(n, p, k);
      let cumulativeProbability = 0;

      for (let x = 0; x <= k; x++) {
        cumulativeProbability += pmf(n, p, x);
      }

      // P(X > k) = 1 - P(X <= k)
      const upperProbability = 1 - cumulativeProbability;

      pmfOutput.textContent = exactProbability.toFixed(6);
      cdfOutput.textContent = cumulativeProbability.toFixed(6);
      upperOutput.textContent = upperProbability.toFixed(6);

      pmfMeaning.textContent =
        `This is the probability of getting exactly ${k} successes in ${n} trials.`;
    }

    let pmfChartBars = [];
    let pmfChartMetrics = null;

    function drawPMFChart() {
      const canvas = document.getElementById("pmf-chart");
      const tooltip = document.getElementById("chart-tooltip");
      const nInput = document.getElementById("n");
      const pInput = document.getElementById("p");

      if (!canvas || !nInput || !pInput) return;

      const n = Number(nInput.value);
      const p = Number(pInput.value);
      const valid = Number.isInteger(n) && n > 0 && Number.isFinite(p) && p >= 0 && p <= 1;

      const rect = canvas.getBoundingClientRect();
      const dpr = window.devicePixelRatio || 1;
      const width = Math.max(320, rect.width);
      const height = Math.max(320, rect.height);
      canvas.width = Math.round(width * dpr);
      canvas.height = Math.round(height * dpr);

      const ctx = canvas.getContext("2d");
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      ctx.clearRect(0, 0, width, height);
      pmfChartBars = [];
      pmfChartMetrics = null;
      hideChartTooltip();

      if (!valid) return;

      const values = Array.from({ length: n + 1 }, (_, x) => pmf(n, p, x));
      const maxProbability = Math.max(...values, 0.01);
      const margin = { top: 28, right: 24, bottom: 58, left: 62 };
      const plotWidth = width - margin.left - margin.right;
      const plotHeight = height - margin.top - margin.bottom;
      const baseline = margin.top + plotHeight;
      const yMax = maxProbability * 1.12;
      const slotWidth = plotWidth / (n + 1);
      const barWidth = Math.max(2, Math.min(42, slotWidth * 0.72));

      ctx.font = '12px system-ui, -apple-system, "Segoe UI", sans-serif';
      ctx.fillStyle = "#6b7280";
      ctx.strokeStyle = "#e5e7eb";
      ctx.lineWidth = 1;

      const tickCount = 5;
      for (let i = 0; i <= tickCount; i++) {
        const value = (yMax / tickCount) * i;
        const y = baseline - (value / yMax) * plotHeight;
        ctx.beginPath();
        ctx.moveTo(margin.left, y);
        ctx.lineTo(width - margin.right, y);
        ctx.stroke();
        ctx.textAlign = "right";
        ctx.textBaseline = "middle";
        ctx.fillText(value.toFixed(3), margin.left - 8, y);
      }

      ctx.strokeStyle = "#9ca3af";
      ctx.beginPath();
      ctx.moveTo(margin.left, margin.top);
      ctx.lineTo(margin.left, baseline);
      ctx.lineTo(width - margin.right, baseline);
      ctx.stroke();

      ctx.fillStyle = "#2563eb";
      values.forEach((probability, x) => {
        const centerX = margin.left + slotWidth * (x + 0.5);
        const barHeight = (probability / yMax) * plotHeight;
        const barX = centerX - barWidth / 2;
        const barY = baseline - barHeight;
        ctx.fillRect(barX, barY, barWidth, barHeight);
        pmfChartBars.push({ x, probability, left: barX, right: barX + barWidth, top: barY, bottom: baseline });
      });

      ctx.fillStyle = "#374151";
      ctx.textAlign = "center";
      ctx.textBaseline = "top";
      const labelStep = n <= 24 ? 1 : Math.ceil(n / 20);
      for (let x = 0; x <= n; x += labelStep) {
        const centerX = margin.left + slotWidth * (x + 0.5);
        ctx.fillText(String(x), centerX, baseline + 9);
      }
      if (n % labelStep !== 0) {
        const centerX = margin.left + slotWidth * (n + 0.5);
        ctx.fillText(String(n), centerX, baseline + 9);
      }

      ctx.fillStyle = "#374151";
      ctx.font = '600 12px system-ui, -apple-system, "Segoe UI", sans-serif';
      ctx.textAlign = "center";
      ctx.fillText("Number of successes X", margin.left + plotWidth / 2, height - 16);

      ctx.save();
      ctx.translate(16, margin.top + plotHeight / 2);
      ctx.rotate(-Math.PI / 2);
      ctx.textAlign = "center";
      ctx.fillText("Probability P(X)", 0, 0);
      ctx.restore();

      const mean = n * p;
      const meanX = margin.left + slotWidth * (mean + 0.5);
      ctx.save();
      ctx.setLineDash([6, 5]);
      ctx.strokeStyle = "#b91c1c";
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(meanX, margin.top);
      ctx.lineTo(meanX, baseline);
      ctx.stroke();
      ctx.restore();

      ctx.fillStyle = "#b91c1c";
      ctx.font = '600 12px system-ui, -apple-system, "Segoe UI", sans-serif';
      ctx.textAlign = meanX > width - 90 ? "right" : "left";
      ctx.textBaseline = "top";
      ctx.fillText(`Mean = ${mean.toFixed(2)}`, meanX + (meanX > width - 90 ? -7 : 7), margin.top + 3);

      pmfChartMetrics = { left: margin.left, top: margin.top, plotWidth, plotHeight, baseline, slotWidth };
    }

    function handleChartMouseMove(event) {
      const canvas = document.getElementById("pmf-chart");
      const tooltip = document.getElementById("chart-tooltip");
      if (!canvas || !tooltip || !pmfChartMetrics) return;

      const rect = canvas.getBoundingClientRect();
      const x = event.clientX - rect.left;
      const y = event.clientY - rect.top;
      const bar = pmfChartBars.find(item => x >= item.left && x <= item.right && y >= item.top && y <= item.bottom);

      if (!bar) {
        hideChartTooltip();
        return;
      }

      tooltip.innerHTML = `X = ${bar.x}<br>P(X=${bar.x}) = ${bar.probability.toFixed(6)}`;
      tooltip.style.display = "block";
      const tooltipWidth = tooltip.offsetWidth;
      const tooltipHeight = tooltip.offsetHeight;
      const left = Math.min(Math.max(8, x + 12), rect.width - tooltipWidth - 8);
      const top = Math.min(Math.max(8, y - tooltipHeight - 10), rect.height - tooltipHeight - 8);
      tooltip.style.left = `${left}px`;
      tooltip.style.top = `${top}px`;
    }

    function hideChartTooltip() {
      const tooltip = document.getElementById("chart-tooltip");
      if (tooltip) tooltip.style.display = "none";
    }

    function poissonPMF(lambda, k) {
      if (!Number.isFinite(lambda) || lambda <= 0 || !Number.isInteger(k) || k < 0) return NaN;
      let probability = Math.exp(-lambda);
      for (let i = 1; i <= k; i++) {
        probability *= lambda / i;
      }
      return probability;
    }

    function validatePoisson() {
      const lambdaInput = document.getElementById("lambda");

        const variance = lambda;
        const standardDeviation = Math.sqrt(lambda);
        const secondMoment = lambda + lambda * lambda;
        const skewness = 1 / Math.sqrt(lambda);

    function updatePoissonPMFAndCDF() {
      const lambdaInput = document.getElementById("lambda");

      if (!lambdaInput || !kInput) return;

      ctx.rotate(-Math.PI / 2);
      ctx.textAlign = "center";
      ctx.fillText("Probability P(X)", 0, 0);
      ctx.restore();

      const meanX = margin.left + slotWidth * (lambda + 0.5);
      ctx.save();
      ctx.setLineDash([6, 5]);
      ctx.strokeStyle = "#b91c1c";
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(meanX, margin.top);
      ctx.lineTo(meanX, baseline);
      ctx.stroke();
      ctx.restore();

      ctx.fillStyle = "#b91c1c";
      ctx.textAlign = meanX > width - 90 ? "right" : "left";
      ctx.textBaseline = "top";
      ctx.fillText(`Mean = ${lambda.toFixed(2)}`, meanX + (meanX > width - 90 ? -7 : 7), margin.top + 3);

      poissonChartMetrics = { left: margin.left, top: margin.top, plotWidth, plotHeight, baseline, slotWidth };
    }

    function handlePoissonChartMouseMove(event) {
      const canvas = document.getElementById("poisson-pmf-chart");
      const tooltip = document.getElementById("poisson-chart-tooltip");
      if (!canvas || !tooltip || !poissonChartMetrics) return;

      const rect = canvas.getBoundingClientRect();
      const x = event.clientX - rect.left;
      const y = event.clientY - rect.top;
      const bar = poissonChartBars.find(item => x >= item.left && x <= item.right && y >= item.top && y <= item.bottom);
      if (!bar) {
        hidePoissonChartTooltip();
        return;
      }

      tooltip.innerHTML = `X = ${bar.x}<br>P(X=${bar.x}) = ${bar.probability.toFixed(6)}`;
      tooltip.style.display = "block";
      const tooltipWidth = tooltip.offsetWidth;
      const tooltipHeight = tooltip.offsetHeight;
      const left = Math.min(Math.max(8, x + 12), rect.width - tooltipWidth - 8);
      const top = Math.min(Math.max(8, y - tooltipHeight - 10), rect.height - tooltipHeight - 8);
      tooltip.style.left = `${left}px`;
      tooltip.style.top = `${top}px`;
    }

    function hidePoissonChartTooltip() {
      const tooltip = document.getElementById("poisson-chart-tooltip");
      if (tooltip) tooltip.style.display = "none";
    }

    navButtons.forEach(btn => {
      btn.addEventListener("click", () => {
        const page = btn.dataset.page;
        history.replaceState(null, "", "#" + page);
        render(page);
      });
    });

    function geometricPMF(p, k) {
      if (!Number.isFinite(p) || p <= 0 || p > 1 || !Number.isInteger(k) || k < 1) return NaN;
      return Math.pow(1 - p, k - 1) * p;
    }

    function validateGeometric() {
      const pInput = document.getElementById("geometric-p");
      if (!pInput) return;

      const p = Number(pInput.value);
      const valid = Number.isFinite(p) && p > 0 && p <= 1;
      const error = document.getElementById("geometric-p-error");
      const selected = document.getElementById("selected-geometric-p");

      pInput.classList.toggle("invalid", !valid);
      error.textContent = valid ? "" : "p must be greater than 0 and less than or equal to 1.";
      selected.textContent = valid ? p : "—";

      if (valid) {
        const mean = 1 / p;
        const variance = (1 - p) / (p * p);
        const standardDeviation = Math.sqrt(variance);
        const secondMoment = (2 - p) / (p * p);
        const skewness = p === 1 ? NaN : (2 - p) / Math.sqrt(1 - p);

        document.getElementById("geometric-mean").textContent = formatNumber(mean);
        document.getElementById("geometric-variance").textContent = formatNumber(variance);
        document.getElementById("geometric-std-dev").textContent = formatNumber(standardDeviation);
        document.getElementById("geometric-second-moment").textContent = formatNumber(secondMoment);
        document.getElementById("geometric-skewness").textContent = formatNumber(skewness);
      } else {
        ["geometric-mean", "geometric-variance", "geometric-std-dev", "geometric-second-moment", "geometric-skewness"]
          .forEach(id => document.getElementById(id).textContent = "—");
      }

      updateGeometricPMFAndCDF();
      drawGeometricPMFChart();
    }

    function updateGeometricPMFAndCDF() {
      const pInput = document.getElementById("geometric-p");
      const kInput = document.getElementById("geometric-k");
      if (!pInput || !kInput) return;

      const p = Number(pInput.value);
      const k = Number(kInput.value);
      const pValid = Number.isFinite(p) && p > 0 && p <= 1;
      const kValid = Number.isInteger(k) && k >= 1;
      const kError = document.getElementById("geometric-k-error");
      const pmfOutput = document.getElementById("geometric-pmf-probability");
      const pmfMeaning = document.getElementById("geometric-pmf-meaning");
      const cdfOutput = document.getElementById("geometric-cdf-probability");
      const upperOutput = document.getElementById("geometric-upper-probability");

      kInput.classList.toggle("invalid", !kValid);
      if (!pValid) {
        kError.textContent = "";
        pmfOutput.textContent = "—";
        cdfOutput.textContent = "—";
        upperOutput.textContent = "—";
        return;
      }

      kError.textContent = kValid ? "" : "k must be a positive integer (k ≥ 1).";
      if (!kValid) {
        pmfOutput.textContent = "—";
        cdfOutput.textContent = "—";
        upperOutput.textContent = "—";
        pmfMeaning.textContent = "P(X = k) means the probability that the first success occurs on the kth trial.";
        return;
      }

      const exactProbability = geometricPMF(p, k);
      const cumulativeProbability = 1 - Math.pow(1 - p, k);
      const upperProbability = Math.pow(1 - p, k);

      pmfOutput.textContent = exactProbability.toFixed(6);
      cdfOutput.textContent = cumulativeProbability.toFixed(6);
      upperOutput.textContent = upperProbability.toFixed(6);
      pmfMeaning.textContent = `P(X = ${k}) means the probability that the first success occurs on the ${k}th trial.`;
    }

    let geometricChartBars = [];
    let geometricChartMetrics = null;

    function geometricChartMaxX(p) {
      if (p >= 1) return 1;
      // Include at least 99.9% of the probability mass.
      const tailTarget = 0.001;
      const maxX = Math.ceil(Math.log(tailTarget) / Math.log(1 - p));
      return Math.max(10, Math.min(100, maxX));
    }

    function drawGeometricPMFChart() {
      const canvas = document.getElementById("geometric-pmf-chart");
      const pInput = document.getElementById("geometric-p");
      if (!canvas || !pInput) return;

      const p = Number(pInput.value);
      const valid = Number.isFinite(p) && p > 0 && p <= 1;
      const rect = canvas.getBoundingClientRect();
      const dpr = window.devicePixelRatio || 1;
      const width = Math.max(320, rect.width);
      const height = Math.max(320, rect.height);
      canvas.width = Math.round(width * dpr);
      canvas.height = Math.round(height * dpr);

      const ctx = canvas.getContext("2d");
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      ctx.clearRect(0, 0, width, height);
      geometricChartBars = [];
      geometricChartMetrics = null;
      hideGeometricChartTooltip();
      if (!valid) return;

      const maxX = geometricChartMaxX(p);
      const values = Array.from({ length: maxX }, (_, i) => geometricPMF(p, i + 1));
      const maxProbability = Math.max(...values, 0.01);
      const margin = { top: 28, right: 24, bottom: 58, left: 62 };
      const plotWidth = width - margin.left - margin.right;
      const plotHeight = height - margin.top - margin.bottom;
      const baseline = margin.top + plotHeight;
      const yMax = maxProbability * 1.12;
      const slotWidth = plotWidth / maxX;
      const barWidth = Math.max(2, Math.min(42, slotWidth * 0.72));

      ctx.font = '12px system-ui, -apple-system, "Segoe UI", sans-serif';
      ctx.fillStyle = "#6b7280";
      ctx.strokeStyle = "#e5e7eb";
      ctx.lineWidth = 1;
      const tickCount = 5;
      for (let i = 0; i <= tickCount; i++) {
        const value = (yMax / tickCount) * i;
        const y = baseline - (value / yMax) * plotHeight;
        ctx.beginPath();
        ctx.moveTo(margin.left, y);
        ctx.lineTo(width - margin.right, y);
        ctx.stroke();
        ctx.textAlign = "right";
        ctx.textBaseline = "middle";
        ctx.fillText(value.toFixed(3), margin.left - 8, y);
      }

      ctx.strokeStyle = "#9ca3af";
      ctx.beginPath();
      ctx.moveTo(margin.left, margin.top);
      ctx.lineTo(margin.left, baseline);
      ctx.lineTo(width - margin.right, baseline);
      ctx.stroke();

      ctx.fillStyle = "#2563eb";
      values.forEach((probability, index) => {
        const x = index + 1;
        const centerX = margin.left + slotWidth * (index + 0.5);
        const barHeight = (probability / yMax) * plotHeight;
        const barX = centerX - barWidth / 2;
        const barY = baseline - barHeight;
        ctx.fillRect(barX, barY, barWidth, barHeight);
        geometricChartBars.push({ x, probability, left: barX, right: barX + barWidth, top: barY, bottom: baseline });
      });

      ctx.fillStyle = "#374151";
      ctx.textAlign = "center";
      ctx.textBaseline = "top";
      const labelStep = maxX <= 24 ? 1 : Math.ceil(maxX / 20);
      for (let x = 1; x <= maxX; x += labelStep) {
        const centerX = margin.left + slotWidth * (x - 0.5);
        ctx.fillText(String(x), centerX, baseline + 9);
      }
      if ((maxX - 1) % labelStep !== 0) {
        const centerX = margin.left + slotWidth * (maxX - 0.5);
        ctx.fillText(String(maxX), centerX, baseline + 9);
      }

      ctx.font = '600 12px system-ui, -apple-system, "Segoe UI", sans-serif';
      ctx.fillText("Number of trials until first success X", margin.left + plotWidth / 2, height - 16);
      ctx.save();
      ctx.translate(16, margin.top + plotHeight / 2);
      ctx.rotate(-Math.PI / 2);
      ctx.textAlign = "center";
      ctx.fillText("Probability P(X)", 0, 0);
      ctx.restore();

      const mean = 1 / p;
      const meanIndex = Math.max(0, Math.min(maxX - 1, mean - 0.5));
      const meanX = margin.left + slotWidth * (meanIndex + 0.5);
      ctx.save();
      ctx.setLineDash([6, 5]);
      ctx.strokeStyle = "#b91c1c";
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(meanX, margin.top);
      ctx.lineTo(meanX, baseline);
      ctx.stroke();
      ctx.restore();

      ctx.fillStyle = "#b91c1c";
      ctx.textAlign = meanX > width - 90 ? "right" : "left";
      ctx.textBaseline = "top";
      ctx.fillText(`Mean = ${mean.toFixed(2)}`, meanX + (meanX > width - 90 ? -7 : 7), margin.top + 3);

      geometricChartMetrics = { left: margin.left, top: margin.top, plotWidth, plotHeight, baseline, slotWidth };
    }

    function handleGeometricChartMouseMove(event) {
      const canvas = document.getElementById("geometric-pmf-chart");
      const tooltip = document.getElementById("geometric-chart-tooltip");
      if (!canvas || !tooltip || !geometricChartMetrics) return;
      const rect = canvas.getBoundingClientRect();
      const x = event.clientX - rect.left;
      const y = event.clientY - rect.top;
      const bar = geometricChartBars.find(item => x >= item.left && x <= item.right && y >= item.top && y <= item.bottom);
      if (!bar) {
        hideGeometricChartTooltip();
        return;
      }
      tooltip.innerHTML = `X = ${bar.x}<br>P(X=${bar.x}) = ${bar.probability.toFixed(6)}`;
      tooltip.style.display = "block";
      const tooltipWidth = tooltip.offsetWidth;
      const tooltipHeight = tooltip.offsetHeight;
      const left = Math.min(Math.max(8, x + 12), rect.width - tooltipWidth - 8);
      const top = Math.min(Math.max(8, y - tooltipHeight - 10), rect.height - tooltipHeight - 8);
      tooltip.style.left = `${left}px`;
      tooltip.style.top = `${top}px`;
    }

    function hideGeometricChartTooltip() {
      const tooltip = document.getElementById("geometric-chart-tooltip");
      if (tooltip) tooltip.style.display = "none";
    }

    const validPages = ["home", "binomial", "poisson", "geometric"];
    const initialPage = location.hash.slice(1);

    render(validPages.includes(initialPage) ? initialPage : "home");
  </script>
</body>
